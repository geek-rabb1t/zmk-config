# 左手・右手・ドングルのすべてに適用する設定。
# PC とつながる側だけの設定 (Studio と DYA Studio の各機能) は snippets/dya-studio にある。

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y

# Zephyr 4.1 では既定で有効になるが、使わないので切る。
CONFIG_CONSOLE=n

# ---------------------------------------------------------------------------
# DYA Studio: 左右とドングルの間で設定や診断のデータをやり取りするための設定
# ---------------------------------------------------------------------------

# 左右間で DYA Studio のデータを中継する。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# kscan-diagnostics が左右の両方で 256 を必要とする。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# 設定を変更してから保存するまでの時間を短くし、電池が切れても変更が消えにくくする。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# スタック不足でのクラッシュを防ぐ (DYA Studio ガイドの推奨値)。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 各モジュールが使う設定の仕組み。ペリフェラル側の設定も Studio から読み書きできるようにする。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Settings タブ: スリープまでの時間を左右で同じにする。
CONFIG_ZMK_SETTINGS_RPC=y

# 診断タブ: 再起動の原因の記録と、キーマトリックスの確認 (左右それぞれで動く)。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
