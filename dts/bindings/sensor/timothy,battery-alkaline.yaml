description: |
  Alkaline cell(s) measured through a resistor divider on an nRF52 SAADC input.
  State of charge is derived from an alkaline discharge curve.

  Battery+ --[R1]--+-- ADC pin --[R2]-- GND
    output-ohms = R2, full-ohms = R1 + R2

compatible: "timothy,battery-alkaline"

include: voltage-divider.yaml

properties:
  cells:
    type: int
    default: 1
    description: Number of cells in series.
